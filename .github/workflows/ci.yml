name: Snakemake validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snakemake
        run: pip install snakemake

      - name: Lint Snakefile (warnings only)
        run: snakemake --lint || true

      - name: Check Snakefile syntax
        run: snakemake --dry-run --cores 1 --forceall --nolock
        continue-on-error: true
