name: Pipeline CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  snakemake-dry-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Snakemake
      run: |
        pip install snakemake snakemake-executor-plugin-slurm
    - name: Create dummy input files
      run: |
        mkdir -p data/raw data/reference/star_index
        # ASO_CTRL samples
        touch data/raw/ASO_CTRL_1_1.fastq.gz data/raw/ASO_CTRL_1_2.fastq.gz
        touch data/raw/ASO_CTRL_2_1.fastq.gz data/raw/ASO_CTRL_2_2.fastq.gz
        touch data/raw/ASO_CTRL_3_1.fastq.gz data/raw/ASO_CTRL_3_2.fastq.gz
        # ASO_VPA samples
        touch data/raw/ASO_VPA_1_1.fastq.gz data/raw/ASO_VPA_1_2.fastq.gz
        touch data/raw/ASO_VPA_2_1.fastq.gz data/raw/ASO_VPA_2_2.fastq.gz
        touch data/raw/ASO_VPA_3_1.fastq.gz data/raw/ASO_VPA_3_2.fastq.gz
        # Scramble_CTRL samples
        touch data/raw/Scramble_CTRL_1_1.fastq.gz data/raw/Scramble_CTRL_1_2.fastq.gz
        touch data/raw/Scramble_CTRL_2_1.fastq.gz data/raw/Scramble_CTRL_2_2.fastq.gz
        touch data/raw/Scramble_CTRL_3_1.fastq.gz data/raw/Scramble_CTRL_3_2.fastq.gz
        # Scramble_VPA samples
        touch data/raw/Scramble_VPA_1_1.fastq.gz data/raw/Scramble_VPA_1_2.fastq.gz
        touch data/raw/Scramble_VPA_2_1.fastq.gz data/raw/Scramble_VPA_2_2.fastq.gz
        touch data/raw/Scramble_VPA_3_1.fastq.gz data/raw/Scramble_VPA_3_2.fastq.gz
        # Reference files
        touch data/reference/hg38.fa
        touch data/reference/hg38.ensGene.gtf
    - name: Run Snakemake dry run
      run: |
        snakemake --dry-run --cores 1
    - name: Validate config
      run: |
        python -c "import yaml; yaml.safe_load(open('configs/config.yaml'))"
        echo "Config is valid YAML"
